<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' file:;">
  <title>NSL Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────────── -->
<div id="toolbar">
  <div id="browser-tabs-container">
    <div id="browser-tabs-list"></div>
    <button class="nav-btn" id="btn-new-tab" title="New Tab">+</button>
  </div>
  <div class="toolbar-nav">
    <button class="nav-btn" id="btn-back"    title="Back"    disabled>‹</button>
  <button class="nav-btn" id="btn-forward" title="Forward" disabled>›</button>
  <button class="nav-btn" id="btn-reload"  title="Reload">↺</button>

  <input id="address-bar" type="text" spellcheck="false"
         placeholder="Search or enter URL…" value="https://www.google.com">

  <div id="loading-indicator"></div>

    <button class="nav-btn" id="btn-sidebar" title="Hide downloads panel (⌘B)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>
      </svg>
      <span id="sidebar-dot"></span>
    </button>
    <button class="nav-btn" id="btn-pin" title="Keep window on top">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 17v5"/><path d="M9 3h6l-1 7 4 3H6l4-3-1-7z"/>
      </svg>
    </button>
    <button class="nav-btn" id="btn-settings" title="Settings" style="font-size:16px">⚙</button>
  </div>
</div>

<!-- ── Main area ────────────────────────────────────────────────── -->
<div id="main">
  <!-- BrowserView is drawn here by Electron; this div is just a background -->
  <div id="browser-area"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-tabs">
      <button class="tab-btn active" data-tab="detected">DETECTED</button>
      <button class="tab-btn"        data-tab="queue">QUEUE</button>
      <button class="tab-btn"        data-tab="done">DONE</button>
      <button class="tab-btn"        data-tab="library">LIBRARY</button>
      <button class="tab-btn"        data-tab="settings">SETTINGS</button>
    </div>

    <!-- Detected videos -->
    <div id="panel-detected" class="panel active">
      <div class="panel-toolbar" id="detected-toolbar" style="display:none">
        <button class="text-btn" id="btn-clear-detected">Clear All</button>
      </div>
      <div class="empty-state" id="detected-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/>
        </svg>
        <p>Browse to any page.<br>Detected videos appear here.</p>
      </div>
      <div id="detected-list"></div>
    </div>

    <!-- Download queue -->
    <div id="panel-queue" class="panel">
      <div class="empty-state" id="queue-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17v2a2 2 0 002 2h16a2 2 0 002-2v-2"/>
        </svg>
        <p>No active downloads.</p>
      </div>
      <div id="queue-list"></div>
    </div>

    <!-- Completed -->
    <div id="panel-done" class="panel">
      <div class="empty-state" id="done-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="20,6 9,17 4,12"/>
        </svg>
        <p>Completed downloads appear here.</p>
      </div>
      <div id="done-list"></div>
    </div>

    <!-- Library -->
    <div id="panel-library" class="panel">
      <div class="empty-state" id="library-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14,2 14,8 20,8"/>
        </svg>
        <p>No files in download folder.</p>
      </div>
      <div id="library-list"></div>
    </div>

    <!-- Settings -->
    <div id="panel-settings" class="panel">
      <div class="settings-panel">
        <div class="setting-row">
          <label class="setting-label">DEFAULT QUALITY</label>
          <select class="setting-input" id="s-quality">
            <option value="4K">4K</option>
            <option value="1080p" selected>1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
            <option value="Audio Only">Audio Only</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="setting-label">DEFAULT FORMAT</label>
          <select class="setting-input" id="s-format">
            <option value="mp4" selected>MP4</option>
            <option value="mkv">MKV</option>
            <option value="webm">WebM</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="setting-label">SAVE FOLDER</label>
          <div class="setting-row-inline">
            <input class="setting-input" id="s-folder" type="text" readonly style="flex:1;cursor:pointer">
            <button class="btn btn-secondary" style="height:26px;flex:0 0 auto;padding:0 10px"
                    id="btn-choose-folder">…</button>
          </div>
        </div>
        <div class="setting-row">
          <label class="setting-label">FILENAME TEMPLATE</label>
          <input class="setting-input" id="s-template" type="text">
          <span style="font-size:10px;color:var(--text3);margin-top:2px">
            Variables: %(title)s %(height)sp %(ext)s %(id)s
          </span>
        </div>
        <div class="setting-row">
          <label class="setting-label">CONCURRENT DOWNLOADS</label>
          <input class="setting-input" id="s-concurrency" type="number" min="1" max="10">
        </div>
        <div class="setting-row">
          <label class="setting-label">STREAM FRAGMENTS</label>
          <input class="setting-input" id="s-fragments" type="number" min="1" max="64">
        </div>
        <div class="setting-row">
          <label class="setting-label">HTTP CONNECTIONS</label>
          <input class="setting-input" id="s-http-connections" type="number" min="1" max="32">
        </div>
        <div class="setting-row">
          <label class="setting-label">HOMEPAGE</label>
          <input class="setting-input" id="s-homepage" type="text">
        </div>

        <div class="settings-section-title">AUDIO</div>
        <div class="setting-row">
          <label class="setting-label">DEFAULT AUDIO FORMAT</label>
          <select class="setting-input" id="s-audio-format">
            <option value="mp3" selected>MP3</option>
            <option value="aac">AAC</option>
            <option value="flac">FLAC</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="setting-label">MP3 QUALITY (kbps)</label>
          <select class="setting-input" id="s-audio-quality">
            <option value="128">128k</option>
            <option value="192">192k</option>
            <option value="320" selected>320k (best)</option>
            <option value="0">VBR best</option>
          </select>
        </div>

        <div class="settings-section-title">CACHE</div>
        <div class="setting-row">
          <button class="btn btn-secondary" id="btn-clear-cache" style="width:100%">Clear Browser Cache</button>
        </div>
      </div>
    </div>

  </div><!-- /sidebar -->
</div><!-- /main -->

<!-- ── Video Player Panel ────────────────────────────────────────── -->
<div id="player-panel" class="player-panel" style="display:none">
  <div class="player-topbar">
    <span id="player-title" class="player-title-text"></span>
    <button id="btn-player-mini" class="player-mini-btn" title="Mini Player — browse while playing">⊟</button>
    <button id="btn-player-close" class="player-close-btn" title="Close (Esc)">✕</button>
  </div>
  <div class="player-video-area">
    <video id="player-video" preload="auto"></video>
  </div>
  <div class="player-controls">
    <div class="player-progress-wrap">
      <div id="player-thumb-preview" class="player-thumb-preview" style="display:none">
        <canvas id="player-thumb-canvas" width="160" height="90"></canvas>
        <span id="player-thumb-time" class="player-thumb-time"></span>
      </div>
      <div id="player-progress-track" class="player-progress-track">
        <div id="player-progress-fill" class="player-progress-fill"></div>
      </div>
    </div>
    <div class="player-bottom-bar">
      <button id="btn-player-play" class="player-play-btn" title="Play/Pause (Space)">▶</button>
      <span id="player-time" class="player-time-display">0:00 / 0:00</span>
    </div>
  </div>
  <video id="player-thumb-video" muted preload="auto" style="display:none"></video>
</div>

<script src="renderer.js"></script>
</body>
</html>
